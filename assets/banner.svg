<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Quiet PC - one click for quiet</title>
  <desc id="desc">A Windows tray app to pause notifications and playback audio, then restore your settings.</desc>
  <rect width="1200" height="420" fill="#E8ECF2"/>
  <path d="M860 0H1200V420H860Q970 210 860 0" fill="#EEEBFC"/>
  <g transform="translate(76 64)">
    <circle cx="32" cy="32" r="30" fill="#5B4AD1"/>
    <ellipse cx="33" cy="32" rx="19" ry="20" fill="#fff"/>
    <ellipse cx="45" cy="25" rx="17" ry="19" fill="#5B4AD1"/>
    <text x="82" y="44" fill="#202332" font-family="Segoe UI, system-ui, sans-serif" font-size="36" font-weight="700">Quiet PC</text>
  </g>
  <g font-family="Segoe UI, system-ui, sans-serif">
    <text x="76" y="224" fill="#202332" font-size="52" font-weight="700">One click for quiet.</text>
    <text x="76" y="282" fill="#62697A" font-size="32">One click to restore.</text>
    <text x="76" y="358" fill="#62697A" font-size="20">Notifications and playback audio, together.</text>
  </g>
  <g transform="translate(956 146) scale(2)">
    <circle cx="32" cy="32" r="30" fill="#5B4AD1"/>
    <ellipse cx="33" cy="32" rx="19" ry="20" fill="#fff"/>
    <ellipse cx="45" cy="25" rx="17" ry="19" fill="#5B4AD1"/>
  </g>
</svg>
